name: Weekly opportunity refresh

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  queue-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Queue weekly rematch for all onboarded users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set SUPABASE_URL and CRON_SECRET repository secrets to enable cron queue."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/opportunity-engine" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"all":true}'
